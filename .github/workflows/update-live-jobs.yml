name: Update verified public job listings

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify JavaScript syntax
        run: git ls-files '*.js' | xargs -r -n 1 node --check
      - name: Run automated tests
        run: node --test tests/*.test.js
      - name: Run Python source-integrity checks
        run: python3 tests/source_integrity.py
      - name: Fetch, filter, and validate public ATS listings
        run: |
          node jobs-server/ingest.js
          node jobs-server/validate-dataset.js jobs-live.json
      - name: Commit changed live dataset
        run: |
          if git diff --quiet -- jobs-live.json; then
            echo "No live dataset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-live.json
          git commit -m "Refresh verified live job listings"
          git push
